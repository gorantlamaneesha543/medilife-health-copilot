services:
  - type: web
    name: medilife-health-copilot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/medilife.sqlite3
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MAX_UPLOAD_MB
        value: 15
      - key: COOKIE_SECURE
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
